# Checks every pull request and every push to main: the CLI (cli/, npm `solaraai`) on each Node it
# supports, and the Claude Code plugin, marketplace and skill. Leaks and workflow safety are
# safety.yml's; publishing is publish.yml's.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # package.json `engines` says Node 20 and newer: the floor and every LTS above it.
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # A stand-in API on 127.0.0.1; the network waits run on this job's Node.
      - run: bun test
      - name: What npm would publish
        run: npm pack --dry-run

  plugin:
    name: Plugin and skill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The marketplace, the plugin and the skill, as Claude Code reads them. --strict fails on the
      # warnings the runtime would tolerate.
      - run: npx -y @anthropic-ai/claude-code@2.1.310 plugin validate . --strict
